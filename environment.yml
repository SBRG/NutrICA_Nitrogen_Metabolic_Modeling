# Conda environment for the ME-model notebooks
# (proteome_constraints.ipynb, plots.ipynb, transcriptomic_constraints.ipynb).
# Versions match the environment the results were produced with (cobrame_env, Python 3.6).
#
#   conda env create -f environment.yml
#   conda activate cobrame_env
#
# ECOLIme (editable clone + one-line fix) and the SoPlex solver are NOT installed by
# this file; see "Installation" in README.md.
name: cobrame_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.6.15
  - pip=21.3.1
  - setuptools=58.0.4
  - numpy=1.19.5
  - pandas=1.1.5
  - scipy=1.5.3
  - matplotlib=3.3.4
  - six=1.16.0
  - jupyter=1.0.0
  - ipykernel=5.5.5
  - jsonschema=4.1.2
  - pip:
      - cobra==0.5.11
      - biopython==1.76
      - sympy==1.5.1
      - openpyxl==3.0.10
      - xlrd==2.0.2
      - cython==0.29.36
      # ME-model framework, pinned to the commit used here
      - git+https://github.com/SBRG/cobrame.git@559ebcb7687ceefcc5905e46e688ea88bae3eb05
